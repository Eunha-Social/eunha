[tools]
node = "lts"
pnpm = "latest"
rust = "latest"
"cargo:cargo-watch" = "latest"
"npm:hongdown" = "latest"
"cargo:sqlx-cli" = "latest"

[tasks.dev]
description = "Run the Rust server with hot-reload"
run = "cargo watch -x run -w src -w migrations"

[tasks.frontend]
description = "Build the eunha web frontend (SPA) into frontend/dist"
run = "cd frontend && pnpm install && pnpm run build"

[tasks."mastodon:status"]
description = "Compare the tracked Mastodon release against the newest one upstream"
run = "SQLX_OFFLINE=true cargo run --quiet --bin eunha-schema -- status"

[tasks."mastodon:plan"]
description = "List the upstream migrations adopting a Mastodon release would involve"
run = "SQLX_OFFLINE=true cargo run --quiet --bin eunha-schema -- plan"

[tasks.fmt]
description = "Format the tree"
run = [
    "cargo fmt",
    # -type f skips AGENTS.md and CLAUDE.md, which are symlinks to README.md.
    "hongdown --write $(find . -maxdepth 1 -name '*.md' -type f)",
]

[tasks."fmt:check"]
description = "Fail if anything is unformatted (run before committing)"
run = [
    "cargo fmt --check",
    "hongdown --check $(find . -maxdepth 1 -name '*.md' -type f)",
]

[tasks."federation"]
description = "Federate eunha with a real Mastodon in Docker, both directions"
run = "scripts/federation_test.sh"

[tasks."differential"]
description = "Compare eunha against a live Mastodon in Docker (needs eunha running)"
run = "scripts/differential_test.sh"

[tasks."entities:build"]
description = "Re-record Mastodon's API entity shapes from a local checkout"
run = "scripts/build_entity_types.sh"

[tasks."schema:build-reference"]
description = "Rebuild the Mastodon reference schema from mastodon/schema.rb (needs Ruby)"
run = "scripts/build_mastodon_schema.sh"

[tasks."schema:check"]
description = "Diff the database against Mastodon's schema for the tracked release"
run = "SQLX_OFFLINE=true cargo run --quiet --bin eunha-schema -- check"
