<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No instance found — eunha.social</title>
  <script>(function(){var t=localStorage.getItem('eunha-theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.add(d?'dark':'light')})();</script>
  <link rel="stylesheet" href="/auth.css">
  <style>
    /* Keep the hosting-service page's distinct minimal, monospace character
       while inheriting the shared light/dark tokens. */
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main { max-width: 480px; width: 100%; }
    h1 { margin: 0 0 2rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted-foreground); }
    p { margin: 0 0 1rem; font-size: 0.8rem; line-height: 1.6; color: var(--muted-foreground); }
    .host { color: var(--foreground); }
    a { color: var(--foreground); }
    a:hover { color: var(--muted-foreground); }
  </style>
</head>
<body>
  <main>
    <h1>eunha.social</h1>
    <p>No fediverse instance is hosted at <span class="host">{{ host }}</span>.</p>
    <p>eunha.social is a fediverse instance hosting service. You can create your own Mastodon-compatible instance and be part of the open social web.</p>
    <p><a href="https://eunha.social">Sign up at eunha.social →</a></p>
  </main>
</body>
</html>
