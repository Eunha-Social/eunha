<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ t_account }} · {{ domain }}</title>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<script>
function clearElkAndGo(){
  Object.keys(localStorage).filter(k=>k.startsWith('elk-')).forEach(k=>localStorage.removeItem(k));
  var r=indexedDB.open('keyval-store');
  r.onsuccess=function(e){var t=e.target.result.transaction('keyval','readwrite');t.objectStore('keyval').delete('elk-users');t.oncomplete=go;t.onerror=go};
  r.onerror=go;
  function go(){location.replace('/')}
}
</script>
<script>(function(){var t=localStorage.getItem('eunha-theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.add(d?'dark':'light')})();</script>
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<div class="topbar">
  <span class="topbar-domain">{{ domain }}</span>
  <button class="signout-btn"
          hx-post="/account/logout"
          hx-swap="none"
          hx-on::after-request="clearElkAndGo()">{{ t_sign_out }}</button>
</div>
<div class="content">
  <h1>@{{ username }}</h1>
  <nav class="nav">
    <a class="nav-link" href="/account/password">{{ t_change_password }}</a>
    <a class="nav-link" href="/">{{ t_go_to_timeline }}</a>
    <a class="nav-link" href="/account/delete">{{ t_delete_account }}</a>
  </nav>
</div>
</body>
</html>
