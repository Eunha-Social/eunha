  <!--
    The symbol, cropped square to its own bounding box (589 x 511 at 105.5,94.6)
    so it fills a favicon rather than sitting in the artboard's margins.
    Light chrome gets Color_02, dark chrome Color_01; the two variants differ
    only in the body and the accent, so one file serves both.
  -->
  <style>
    :root { --body: #00102a; --accent: #7ae2d1; --ring: #7ae2d1; }
    @media (prefers-color-scheme: dark) {
      :root { --body: #f8f4eb; --accent: #b197ed; }
    }
    .body { fill: var(--body); }
    .accent { fill: var(--accent); }
    .ring { fill: var(--ring); }
  </style>
