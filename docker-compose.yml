services:
  app:
    build:
      context: .
      network: host
    restart: unless-stopped
    environment:
      REDIS_URL: redis://host.docker.internal
      DATABASE_URL: postgres://limeburst@host.docker.internal/eunha
      BIND_ADDRESS: 0.0.0.0:3000
      RUST_LOG: eunha=debug,tower_http=info,sqlx=warn
    ports:
      - "50000:3000"
    volumes:
      - ./config.toml:/app/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
